<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data:;">
  <title>Level 5 – Attack Simulation | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0e17; --bg2:#111827; --primary:#00ff41; --text:#c8d6e5; --text-dim:#4a5568; --font-mono:'Share Tech Mono',monospace; --font-display:'Orbitron',sans-serif; }
    body { background:var(--bg); color:var(--text); font-family:var(--font-mono); min-height:100vh; padding:2rem; }
    .container { max-width:700px; margin:0 auto; }
    h1 { font-family:var(--font-display); font-size:2rem; color:#fff; text-align:center; }
    h1 span { color:#ff3333; }
    .subtitle { text-align:center; color:var(--text-dim); margin-bottom:2rem; font-size:0.9rem; }
    .score-bar { display:flex; justify-content:space-between; background:var(--bg2); border:1px solid rgba(255,51,51,0.15); border-radius:12px; padding:1rem 1.5rem; margin-bottom:2rem; }
    .score-bar .score { font-family:var(--font-display); color:#ff3333; font-size:1.3rem; }
    .scenario-card { background:var(--bg2); border:1px solid rgba(255,51,51,0.12); border-radius:16px; padding:1.5rem; margin-bottom:1rem; }
    .scenario-card .num { color:#ff3333; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; }
    .scenario-card .scenario-text { color:#fff; margin:0.5rem 0 1rem; line-height:1.6; }
    .scenario-card .scenario-text strong { color:#ffaa00; }
    input { width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--text-dim); border-radius:8px; padding:0.7rem 1rem; color:var(--text); font-family:var(--font-mono); outline:none; margin-bottom:0.5rem; }
    input:focus { border-color:#ff3333; }
    .chk-btn { padding:0.6rem 1.5rem; border:1px solid #ff3333; background:transparent; color:#ff3333; font-family:var(--font-mono); cursor:pointer; border-radius:6px; transition:all 0.3s; }
    .chk-btn:hover { background:#ff3333; color:#fff; }
    .fb { font-size:0.85rem; min-height:1.5rem; margin-top:0.5rem; }
    .fb-correct { color:var(--primary); }
    .fb-wrong { color:#ff3333; }
    .back { text-align:center; margin-top:2rem; }
    .back a { color:var(--primary); text-decoration:none; }
    @media(max-width:600px) { body { padding:1rem; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🔴 <span>Level 5</span> — Attack Simulation</h1>
  <p class="subtitle">Real penetration testing scenarios — what command or tool do you use?</p>
  <div class="score-bar"><span>Score</span><span class="score"><span id="scoreDisplay">0</span>/<span id="totalDisplay">5</span></span></div>
  <div id="scenarios"></div>
  <div class="back"><a href="task.html">⬅ Back to Levels</a></div>
</div>
<script>
  const scenarios = [
    { scenario: "You're scanning a target network to find live hosts on 192.168.1.0/24. <strong>What nmap command do you use?</strong>", answer: "nmap -sn 192.168.1.0/24", valid: ["nmap -sn 192.168.1.0/24", "nmap -sn 192.168.1.0-255"] },
    { scenario: "You found a login page and want to test for SQL injection. <strong>What payload bypasses a login with username 'admin'?</strong>", answer: "admin' --", valid: ["admin' --", "' or '1'='1", "' or 1=1 --", "admin' or '1'='1"] },
    { scenario: "You need to find all SUID binaries on a compromised Linux machine. <strong>What command?</strong>", answer: "find / -perm -4000 2>/dev/null", valid: ["find / -perm -4000", "find / -perm -4000 2>/dev/null"] },
    { scenario: "You captured a password hash and want to crack it with rockyou.txt using John the Ripper. <strong>What command?</strong>", answer: "john --wordlist=/usr/share/wordlists/rockyou.txt hash.txt", valid: ["john --wordlist=rockyou.txt hash.txt", "john hash.txt"] },
    { scenario: "You need to brute-force SSH as root on 192.168.1.100 using Hydra with rockyou.txt. <strong>What command?</strong>", answer: "hydra -l root -P /usr/share/wordlists/rockyou.txt ssh://192.168.1.100", valid: ["hydra -l root -P rockyou.txt ssh://192.168.1.100", "hydra -l root -P /usr/share/wordlists/rockyou.txt ssh://192.168.1.100"] }
  ];

  let score = parseInt(localStorage.getItem('level5_score') || '0');
  let done = JSON.parse(localStorage.getItem('level5_done') || '[false,false,false,false,false]');

  document.getElementById('totalDisplay').textContent = scenarios.length;
  document.getElementById('scoreDisplay').textContent = score;

  function render() {
    const area = document.getElementById('scenarios');
    let html = '';
    scenarios.forEach((s, i) => {
      const completed = done[i] || false;
      html += `<div class="scenario-card" id="card${i}">
        <div class="num">Scenario ${i+1} ${completed ? '✅' : ''}</div>
        <div class="scenario-text">${s.scenario}</div>
        <input type="text" id="ans${i}" placeholder="Type your command..." ${completed ? 'disabled' : ''}>
        <button class="chk-btn" onclick="check(${i})" ${completed ? 'disabled' : ''}>${completed ? 'Done ✓' : 'Execute'}</button>
        <div class="fb" id="fb${i}"></div>
      </div>`;
    });
    area.innerHTML = html;
  }

  function check(idx) {
    const input = document.getElementById('ans' + idx);
    const fb = document.getElementById('fb' + idx);
    const ans = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
    if (!ans) { fb.textContent = '⚠️ Enter a command!'; fb.className = 'fb'; return; }
    const valid = scenarios[idx].valid.map(v => v.toLowerCase().replace(/\s+/g, ' '));
    if (valid.includes(ans) || ans === scenarios[idx].answer.toLowerCase().replace(/\s+/g, ' ')) {
      fb.textContent = '✅ Correct! You solved the scenario.'; fb.className = 'fb fb-correct';
      if (!done[idx]) {
        done[idx] = true;
        score++;
        localStorage.setItem('level5_score', score);
        localStorage.setItem('level5_done', JSON.stringify(done));
        document.getElementById('scoreDisplay').textContent = score;
      }
      input.disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).textContent = 'Done ✓';
    } else {
      fb.textContent = '❌ Not quite. Hint: Check the Ethical Hacking lab page for command reference!'; fb.className = 'fb fb-wrong';
    }
  }

  render();
</script>
</body>
</html>

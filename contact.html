<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact CyberArena - Report bugs, suggest features, or get help">
  <title>Contact | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e17;
      --bg2: #111827;
      --primary: #00ff41;
      --text: #c8d6e5;
      --text-dim: #4a5568;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }
    nav {
      background: rgba(10,14,23,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,255,65,0.15);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    nav .logo a {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--primary);
      letter-spacing: 3px;
    }
    nav .logo a span { color: #0ff; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; }
    .nav-links a:hover { color: var(--primary); }
    .container { max-width: 650px; margin: 0 auto; padding: 2rem; }
    .hero { text-align: center; padding: 3rem 1rem 2rem; }
    .hero h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: #fff;
    }
    .hero h1 span { color: var(--primary); }
    .hero p { color: var(--text-dim); margin-top: 0.5rem; font-size: 0.9rem; }
    .form-card {
      background: rgba(17,24,39,0.8);
      border: 1px solid rgba(0,255,65,0.12);
      border-radius: 16px;
      padding: 2.5rem;
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--text-dim);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,65,0.2); }
    .form-group textarea { min-height: 140px; resize: vertical; }
    .form-group select option { background: var(--bg); color: var(--text); }
    .btn {
      padding: 0.9rem 2rem;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      width: 100%;
    }
    .btn:hover { background: transparent; color: var(--primary); box-shadow: 0 0 25px rgba(0,255,65,0.3); }
    .status-msg { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; min-height: 2rem; }
    .footer { text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid rgba(0,255,65,0.1); margin-top: 3rem; }
    @media (max-width: 600px) {
      .form-card { padding: 1.5rem; }
      .nav-links { gap: 0.8rem; }
      .nav-links a { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><a href="/">Cyber<span>Arena</span></a></div>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="awareness.html">Awareness</a></li>
    <li><a href="task.html">Challenges</a></li>
    <li><a href="leaderboard.html">Leaderboard</a></li>
    <li><a href="terminal.html">Terminal</a></li>
  </ul>
</nav>

<div class="container">
  <div class="hero">
    <h1>📡 <span>Contact</span> CyberArena</h1>
    <p>Report bugs, suggest new labs, or send feedback. All messages encrypted in transit.</p>
  </div>

  <div class="form-card">
    <form id="contactForm">
      <div class="form-group">
        <label>Your Email (for reply)</label>
        <input type="email" id="email" placeholder="hacker@example.com" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="bug">🐛 Bug Report</option>
          <option value="feature">💡 Feature Suggestion</option>
          <option value="content">📚 Lab/Content Issue</option>
          <option value="security">🔐 Security Concern</option>
          <option value="other">❓ Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="subject" placeholder="Brief title of your message" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="message" placeholder="Describe in detail..." required></textarea>
      </div>
      <button type="submit" class="btn">📨 Send Message</button>
    </form>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<div class="footer">
  CyberArena — Educational Cybersecurity Platform | <a href="/" style="color:var(--primary);">Home</a>
</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const status = document.getElementById('statusMsg');
    const btn = this.querySelector('button');
    
    const data = {
      email: document.getElementById('email').value,
      category: document.getElementById('category').value,
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value
    };

    btn.disabled = true;
    btn.textContent = '⏳ Sending...';
    status.textContent = '';
    status.style.color = '#00ff41';

    try {
      // 👇 REPLACE THIS URL with your Formspree endpoint
      const response = await fetch('https://formspree.io/f/mzdqpkzv', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        status.innerHTML = '✅ Message sent successfully! I\'ll get back to you soon.';
        this.reset();
      } else {
        throw new Error('Server error');
      }
    } catch (err) {
      status.textContent = '❌ Failed to send. Try emailing directly: bhavanip682@outlook.com';
      status.style.color = '#ff3333';
    }

    btn.disabled = false;
    btn.textContent = '📨 Send Message';
  });
</script>
</body>
</html>

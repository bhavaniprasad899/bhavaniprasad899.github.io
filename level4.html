<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data:;">
  <title>Level 4 – CTF Logic | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0e17; --bg2:#111827; --primary:#00ff41; --text:#c8d6e5; --text-dim:#4a5568; --font-mono:'Share Tech Mono',monospace; --font-display:'Orbitron',sans-serif; }
    body { background:var(--bg); color:var(--text); font-family:var(--font-mono); min-height:100vh; padding:2rem; }
    .container { max-width:700px; margin:0 auto; }
    h1 { font-family:var(--font-display); font-size:2rem; color:#fff; text-align:center; }
    h1 span { color:var(--primary); }
    .subtitle { text-align:center; color:var(--text-dim); margin-bottom:2rem; font-size:0.9rem; }
    .score-bar { display:flex; justify-content:space-between; background:var(--bg2); border:1px solid rgba(0,255,65,0.1); border-radius:12px; padding:1rem 1.5rem; margin-bottom:2rem; }
    .score-bar .score { font-family:var(--font-display); color:var(--primary); font-size:1.3rem; }
    .timer { color:var(--primary); font-family:var(--font-display); }
    .challenge-card { background:var(--bg2); border:1px solid rgba(0,255,65,0.12); border-radius:16px; padding:1.5rem; margin-bottom:1rem; }
    .challenge-card .num { color:var(--primary); font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; }
    .challenge-card .question { color:#fff; margin:0.5rem 0 1rem; }
    .challenge-card .hint { color:var(--text-dim); font-size:0.8rem; margin-bottom:0.5rem; }
    input { width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--text-dim); border-radius:8px; padding:0.7rem 1rem; color:var(--text); font-family:var(--font-mono); outline:none; margin-bottom:0.5rem; }
    input:focus { border-color:var(--primary); }
    .chk-btn { padding:0.6rem 1.5rem; border:1px solid var(--primary); background:transparent; color:var(--primary); font-family:var(--font-mono); cursor:pointer; border-radius:6px; transition:all 0.3s; }
    .chk-btn:hover { background:var(--primary); color:var(--bg); }
    .fb { font-size:0.85rem; min-height:1.5rem; margin-top:0.5rem; }
    .fb-correct { color:var(--primary); }
    .fb-wrong { color:#ff3333; }
    .fb-hint { color:#ffaa00; }
    .back { text-align:center; margin-top:2rem; }
    .back a { color:var(--primary); text-decoration:none; }
    @media(max-width:600px) { body { padding:1rem; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🟠 <span>Level 4</span> — CTF Logic</h1>
  <p class="subtitle">Solve CTF challenges. Enter flags to score. Timer: <span class="timer" id="timerDisplay">05:00</span></p>
  <div class="score-bar"><span>Score</span><span class="score"><span id="scoreDisplay">0</span>/<span id="totalDisplay">5</span></span></div>
  <div id="challenges"></div>
  <div class="back"><a href="task.html">⬅ Back to Levels</a></div>
</div>
<script>
  const challenges = [
    { q: "Decode this binary: 01000110 01001100 01000001 01000111", answer: "FLAG", hint: "Convert binary to text (8 bits per character)" },
    { q: "Decode this hex: 48 65 6c 6c 6f", answer: "Hello", hint: "Hex to ASCII — use an online converter or echo in terminal" },
    { q: "Base64 decode: Q3liZXJBcmVuYQ==", answer: "CyberArena", hint: "Use echo 'Q3liZXJBcmVuYQ==' | base64 -d" },
    { q: "What port number is SSH?", answer: "22", hint: "SSH = Secure Shell. Think about the default port." },
    { q: "ROT13 decode: PloreNeran", answer: "CyberArena", hint: "ROT13 shifts each letter by 13 positions" }
  ];

  let score = parseInt(localStorage.getItem('level4_score') || '0');
  let done = JSON.parse(localStorage.getItem('level4_done') || '[false,false,false,false,false]');

  document.getElementById('totalDisplay').textContent = challenges.length;
  document.getElementById('scoreDisplay').textContent = score;

  // Timer
  let timeLeft = 300;
  const timerEl = document.getElementById('timerDisplay');
  const timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerEl.textContent = '00:00';
      document.querySelectorAll('input').forEach(i => i.disabled = true);
      document.querySelectorAll('.chk-btn').forEach(b => b.disabled = true);
    }
  }, 1000);

  function render() {
    const area = document.getElementById('challenges');
    let html = '';
    challenges.forEach((c, i) => {
      const completed = done[i] || false;
      html += `<div class="challenge-card" id="card${i}">
        <div class="num">Challenge ${i+1} ${completed ? '✅' : ''}</div>
        <div class="question">${c.q}</div>
        <div class="hint">💡 ${c.hint}</div>
        <input type="text" id="ans${i}" placeholder="Enter flag..." ${completed ? 'disabled' : ''}>
        <button class="chk-btn" onclick="check(${i})" ${completed ? 'disabled' : ''}>${completed ? 'Done ✓' : 'Submit Flag'}</button>
        <div class="fb" id="fb${i}"></div>
      </div>`;
    });
    area.innerHTML = html;
  }

  function check(idx) {
    if (timeLeft <= 0) { document.getElementById('fb' + idx).textContent = '⏱ Time is up!'; return; }
    const input = document.getElementById('ans' + idx);
    const fb = document.getElementById('fb' + idx);
    const ans = input.value.trim();
    if (!ans) { fb.textContent = '⚠️ Enter a flag!'; fb.className = 'fb fb-hint'; return; }
    if (ans.toLowerCase() === challenges[idx].answer.toLowerCase()) {
      fb.textContent = '✅ Correct! Flag captured!'; fb.className = 'fb fb-correct';
      if (!done[idx]) {
        done[idx] = true;
        score++;
        localStorage.setItem('level4_score', score);
        localStorage.setItem('level4_done', JSON.stringify(done));
        document.getElementById('scoreDisplay').textContent = score;
      }
      input.disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).textContent = 'Done ✓';
    } else {
      fb.textContent = '❌ Wrong flag. Check the hint and try again!'; fb.className = 'fb fb-wrong';
    }
  }

  render();
</script>
</body>
</html>

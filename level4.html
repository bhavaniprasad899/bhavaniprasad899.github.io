<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Level 4 – CTF Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.box{max-width:750px;width:100%;background:#111;border:2px solid #f80;border-radius:10px;padding:30px;margin-top:20px;box-shadow:0 0 30px rgba(255,136,0,0.1)}
h1{text-align:center;color:#f80;font-size:26px;margin-bottom:5px;text-shadow:0 0 10px rgba(255,136,0,0.5)}
h2{text-align:center;color:#a50;font-size:14px;margin-bottom:20px;font-weight:normal}
.mission{background:#0d0d0d;border:1px solid #a50;border-radius:6px;padding:15px;margin-bottom:20px;font-size:13px;line-height:1.6}
.mission span{color:#f80}
.panel{background:#0d0d0d;border:1px solid #a50;border-radius:6px;padding:20px;margin-bottom:15px}
.panel h3{color:#f80;font-size:16px;margin-bottom:8px}
.panel p{color:#aaa;font-size:13px;margin-bottom:10px;line-height:1.5}
.panel .flag-box{background:#0a0a0a;border:1px solid #5a3a0a;border-radius:4px;padding:15px;font-size:18px;color:#f80;margin:10px 0;text-align:center;font-weight:bold;letter-spacing:2px}
.panel .cipher-text{background:#0a0a0a;border:1px solid #5a3a0a;border-radius:4px;padding:12px;font-size:14px;color:#ff0;margin:10px 0;text-align:center;font-family:monospace;word-break:break-all}
.panel input{width:100%;padding:10px;background:#1a1a1a;border:1px solid #5a3a0a;border-radius:4px;color:#f80;font-family:'Courier New',monospace;font-size:14px;outline:none;margin-bottom:8px}
.panel input:focus{border-color:#f80;box-shadow:0 0 8px rgba(255,136,0,0.2)}
.panel button{padding:8px 20px;background:#f80;color:#000;border:none;border-radius:4px;font-family:'Courier New',monospace;font-weight:bold;font-size:14px;cursor:pointer}
.panel button:hover{background:#d60;box-shadow:0 0 10px rgba(255,136,0,0.4)}
.feedback{margin-top:8px;font-size:13px;padding:8px;border-radius:4px}
.fb-correct{color:#0f0}.fb-wrong{color:#f44}.fb-hint{color:#f80}
.progress{display:flex;justify-content:center;margin-bottom:20px}
.dot{width:12px;height:12px;border-radius:50%;margin:0 5px;background: #3a2a1a;border:1px solid #5a3a0a; display: inline-block} .dot.done{background:#f80;border-color:#f80;box-shadow:0 0 6px #f80}
.status-bar{display:flex;justify-content:space-between;padding:10px;background:#0d0d0d;border-radius:4px;margin-bottom:20px;font-size:12px;color:#888}
.status-bar span{color:#f80}
.timer{text-align:center;font-size:16px;color:#f80;margin-bottom:15px}
.back{display:block;text-align:center;margin-top:20px;color:#5a3a0a;text-decoration:none;font-size:13px}
.back:hover{color:#f80}
</style>
</head>
<body>
<div class="box">
<h1>🟠 Level 4 – CTF Logic</h1>
<h2>━━ Capture The Flag Challenges ━━</h2>
<div class="status-bar"><div>Score: <span id="score">0</span>/5</div><div id="timerDisplay" class="timer" style="margin:0">⏱️ <span id="timer">300</span>s</div></div>
<div class="progress" id="progress"></div>
<div class="mission"><span>🎯 MISSION:</span> Solve 5 CTF-style challenges. Each one reveals a flag. Enter the flag to score. You have 5 minutes!</div>
<div id="ca"></div>
<a href="task.html" class="back">⬅ Back to Levels</a>
</div>
<script>
let timeLeft=300;let timerRunning=false;
const challenges=[
{title:'🔢 Challenge 1: Binary Decode','desc':'A message was found in binary. Decode it to get the flag.','display':'01000110 01001100 01000001 01000111 01111011 01100010 01101001 01101110 01100001 01110010 01111001 01011111 01101001 01110011 01011111 01100110 01110101 01101110 01111101','answer':'flag{binary_is_fun}'},
{title:'🔤 Challenge 2: Caesar Cipher','desc':'Julius Caesar used a shift cipher. Decode:','display':'VHGUDQGVRIGUHHGRP','answer':'flag{caesar_cipher}'},
{title:'🔐 Challenge 3: Hex Decode','desc':'Hexadecimal encoding — decode this:','display':'666c61677b6865785f6465636f64696e675f726f636b737d','answer':'flag{hex_decoding_rocks}'},
{title:'🧮 Challenge 4: ROT13','desc':'ROT13 shifts letters by 13 positions. Decode:','display':'SYNT{EBG13_VF_PBBY}','answer':'flag{rot13_is_cool}'},
{title:'🔓 Challenge 5: Hash Crack','desc':'An MD5 hash was found: <b>900150983cd24fb0d6963f7d28e17f72</b><br>This hash is a common 3-letter word. What is it?','display':'Hash: 900150983cd24fb0d6963f7d28e17f72','answer':'abc'}
];
let cur=0;let sc=0;let done=[false,false,false,false,false];
const ca=document.getElementById('ca');const se=document.getElementById('score');
const pe=document.getElementById('progress');const te=document.getElementById('timer');

function rp(){pe.innerHTML='';for(let i=0;i<challenges.length;i++){let d=document.createElement('span');d.className='dot';if(done[i])d.className='dot done';pe.appendChild(d);}}

function startTimer(){if(timerRunning)return;timerRunning=true;let iv=setInterval(()=>{timeLeft--;te.textContent=timeLeft;if(timeLeft<=0){clearInterval(iv);ca.innerHTML=`<div style="text-align:center;padding:30px"><div style="font-size:50px;">⏰</div><h2 style="color:#f44;font-size:24px;margin:15px 0">TIME IS UP!</h2><p style="color:#aaa">You scored ${sc}/${challenges.length}</p><button onclick="location.reload()" style="margin-top:15px;padding:10px 20px;background:#f80;color:#000;border:none;border-radius:4px;font-family:monospace;font-weight:bold;font-size:14px;cursor:pointer">TRY AGAIN</button></div>`;}},1000);}

function ld(idx){
if(idx>=challenges.length){ca.innerHTML=`<div style="text-align:center;padding:30px"><div style="font-size:50px;">🏆</div><h2 style="color:#f80;font-size:24px;margin:15px 0">🎉 CAPTURE THE FLAG COMPLETE!</h2><p style="color:#aaa;font-size:14px">Score: ${sc}/${challenges.length}</p><p style="color:#0f0;font-size:16px;margin:15px">${sc>=4?'🟠 You earned: CTF MASTER BADGE: '+timeLeft+'s remaining! 🏁':'🟡 Keep hacking!'}</p></div>`;return;}
const c=challenges[idx];
if(idx===0)startTimer();
ca.innerHTML=`<div class="panel"><h3>${c.title}</h3><p>${c.desc}</p><div class="cipher-text">${c.display}</div><input type="text" id="ans" placeholder="Enter the flag..." autocomplete="off"><button id="btn">Submit</button><div id="fb" class="feedback"></div></div>`;
document.getElementById('btn').addEventListener('click',()=>ch(idx));document.getElementById('ans').addEventListener('keypress',(e)=>{if(e.key==='Enter')ch(idx)});document.getElementById('ans').focus();}

function ch(idx){const inp=document.getElementById('ans');const fb=document.getElementById('fb');const ans=inp.value.trim().toLowerCase();const c=challenges[idx];if(!ans){fb.textContent='⚠️ Enter the flag!';fb.className='feedback fb-hint';return}
if(ans===c.answer.toLowerCase()){fb.textContent='✅ FLAG CAPTURED! Correct!';fb.className='feedback fb-correct';done[idx]=true;sc++;se.textContent=sc;setTimeout(()=>{cur++;ld(cur);rp()},1200)}
else{fb.innerHTML='❌ Wrong flag. Hint: The answer format is typically "flag{...}" or a simple word.';fb.className='feedback fb-wrong';setTimeout(()=>{cur++;ld(cur);rp()},1800)}rp();}
rp();ld(0);
</script>
</body>
</html>

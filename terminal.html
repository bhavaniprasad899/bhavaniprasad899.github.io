<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberArena – Hacker Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: #111;
            border: 1px solid #0a5a0a;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            color: #00ff00;
            font-size: 13px;
        }
        .header .title {
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }
        .header-controls button {
            background: none;
            border: 1px solid #0a5a0a;
            color: #00ff00;
            padding: 4px 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 3px;
        }
        .header-controls button:hover {
            background: #00ff00;
            color: #000;
        }
        #terminal {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #0a5a0a;
            border-radius: 0 0 6px 6px;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #00ff00;
        }
        #terminal .output-line {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 2px;
        }
        #terminal .output-line.green { color: #00ff00; }
        #terminal .output-line.red { color: #ff4444; }
        #terminal .output-line.yellow { color: #ffff00; }
        #terminal .output-line.cyan { color: #00ffff; }
        #terminal .output-line.gray { color: #888; }
        #terminal .output-line.white { color: #ffffff; }
        #terminal .output-line.magenta { color: #ff00ff; }
        #terminal .output-line.prompt { color: #00ff00; }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 4px;
        }
        .input-line .prompt-symbol {
            color: #00ff00;
            margin-right: 8px;
            white-space: nowrap;
        }
        #cmdInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            caret-color: #00ff00;
        }
        .back-link {
            text-align: center;
            margin-top: 8px;
        }
        .back-link a {
            color: #0a5a0a;
            text-decoration: none;
            font-size: 12px;
        }
        .back-link a:hover {
            color: #00ff00;
        }
        .blink {
            animation: blink-cursor 1s step-end infinite;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* Scrollbar */
        #terminal::-webkit-scrollbar { width: 6px; }
        #terminal::-webkit-scrollbar-track { background: #0a0a0a; }
        #terminal::-webkit-scrollbar-thumb { background: #0a5a0a; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <span class="title">☠ CYBERARENA :: HACKER TERMINAL ☠</span>
        <div class="header-controls">
            <button onclick="clearTerminal()">CLEAR</button>
            <button onclick="toggleStyle()">STYLE</button>
        </div>
    </div>

    <div id="terminal">
        <div class="output-line cyan">☠ CYBERARENA :: ADVANCED HACKER TERMINAL ☠</div>
        <div class="output-line gray">Booting Offensive Lab...</div>
        <div class="output-line gray">Type 'help' to see available commands.</div>
        <div class="output-line green">——————————————————————————</div>
        <div id="outputArea"></div>
        <div class="input-line">
            <span class="prompt-symbol">root@cyberarena:~$</span>
            <input type="text" id="cmdInput" autofocus spellcheck="false" autocomplete="off">
        </div>
    </div>

    <div class="back-link"><a href="index.html">⬅ Back to Home</a></div>

                        return { lines: [{ text: 'No commands in history.', cls: 'gray' }] };

                        lines: commandHistory.map((c, i) => ({

                        }))
                    };

                case 'clear':
                    return { clear: true };

                case 'exit':
                    return { lines: [{ text: '[Terminal session ended. Refresh page to restart.]', cls: 'yellow' }] };

                default:
                    return {
                        lines: [
                            { text: `bash: ${cmd}: command not found`, cls: 'red' },
                            { text: 'Type "help" for available commands.', cls: 'gray' },
                        ]
                    };
            }
        }

        // ============================================================
        // EXECUTE COMMAND
        // ============================================================

        function executeCommand(input) {
            const trimmed = input.trim();
            if (!trimmed) return;

            // Save to history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Parse command and args
            const parts = trimmed.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
            const cmd = parts[0]?.toLowerCase() || '';
            const args = parts.slice(1).join(' ');

            // Special: ls -la
            const cmdKey = cmd === 'ls' && parts[1] === '-la' ? 'ls -la' : cmd;

            const output = getOutput(cmdKey, args);

            if (output && output.clear) {
                outputArea.innerHTML = '';
                return;
            }

            if (output && output.lines) {
                output.lines.forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'output-line ' + (line.cls || 'white');
                    div.textContent = line.text || '';
                    outputArea.appendChild(div);
                });
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const input = this.value;
                
                // Echo the command with prompt
                const echoDiv = document.createElement('div');
                echoDiv.className = 'output-line prompt';
                echoDiv.textContent = 'root@cyberarena:~$ ' + input;
                outputArea.appendChild(echoDiv);

                executeCommand(input);
                
                this.value = '';
                terminal.scrollTop = terminal.scrollHeight;
                
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                    // Move cursor to end
                    setTimeout(() => cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length), 0);
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep terminal focused
        document.addEventListener('click', () => cmdInput.focus());

        // ============================================================
        // UTILITIES
        // ============================================================

        function clearTerminal() {
            outputArea.innerHTML = '';
            cmdInput.focus();
        }

        function toggleStyle() {
            if (styleMode === 'hacker') {
                document.body.style.background = '#001100';
                document.getElementById('terminal').style.background = '#001a00';
                styleMode = 'green';
            } else if (styleMode === 'green') {
                document.body.style.background = '#000022';
                document.getElementById('terminal').style.background = '#000033';
                styleMode = 'blue';
            } else {
                document.body.style.background = '#0a0a0a';
                document.getElementById('terminal').style.background = '#0d0d0d';
                styleMode = 'hacker';
            }
            cmdInput.focus();
        }

        // Auto-focus
        cmdInput.focus();
    </script>
</body>
</html>

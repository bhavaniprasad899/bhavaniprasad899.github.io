<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data:;">
  <title>Level 6: Ultimate Hacker Quiz | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0a0e17; --bg2: #111827; --primary: #00ff41; --text: #c8d6e5; --text-dim: #4a5568; --font-mono: 'Share Tech Mono', monospace; --font-display: 'Orbitron', sans-serif; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-family: var(--font-display); font-size: 2rem; color: #fff; text-align: center; margin-bottom: 0.5rem; }
    h1 span { color: var(--primary); }
    .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 2rem; }
    .score-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg2); border: 1px solid rgba(0,255,65,0.1); border-radius: 12px; padding: 1rem 1.5rem; margin-bottom: 2rem; }
    .score-bar .score { font-family: var(--font-display); font-size: 1.5rem; color: var(--primary); }
    .score-bar .total { color: var(--text-dim); }
    .question-card { background: var(--bg2); border: 1px solid rgba(0,255,65,0.12); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
    .question-card .q-num { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-card .q-text { color: #fff; font-size: 1.1rem; margin-bottom: 1rem; }
    .options { display: flex; flex-direction: column; gap: 0.7rem; }
    .options label { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--text-dim); border-radius: 8px; cursor: pointer; transition: all 0.3s; }
    .options label:hover { border-color: var(--primary); }
    .options input[type="radio"] { accent-color: var(--primary); }
    .btn { display: block; width: 100%; padding: 1rem; border: 1px solid var(--primary); background: var(--primary); color: var(--bg); font-family: var(--font-mono); font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 8px; transition: all 0.3s; margin-top: 1rem; }
    .btn:hover { background: transparent; color: var(--primary); box-shadow: 0 0 25px rgba(0,255,65,0.3); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .result { text-align: center; padding: 3rem; }
    .result h2 { font-family: var(--font-display); font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
    .result p { color: var(--text-dim); margin-bottom: 1.5rem; }
    .status { text-align: center; margin-top: 1rem; font-size: 0.9rem; min-height: 2rem; }
    .back-link { display: inline-block; margin-top: 2rem; color: var(--primary); text-decoration: none; text-align: center; }
    @media (max-width: 600px) { .question-card { padding: 1.2rem; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🟣 <span>Level 6</span> — Ultimate Hacker Quiz</h1>
  <p class="subtitle">Test your cybersecurity knowledge. 20 questions. Pass with 14+ correct.</p>

  <div class="score-bar">
    <span class="total">Score</span>
    <span class="score"><span id="correctCount">0</span>/<span id="totalQuestions">20</span></span>
  </div>

  <div id="questionsArea"></div>

  <button class="btn" id="submitBtn" onclick="submitQuiz()">✅ Submit Answers & Get Points!</button>
  <div class="status" id="statusMsg"></div>

  <div style="text-align:center;margin-top:2rem;">
    <a href="task.html" class="back-link">⬅ Back to Levels</a>
  </div>
</div>

<script>
  const questions = [
    { q: "What does XSS stand for in cybersecurity?", opts: ["Cross Server Scripting", "Cross Secure Socket", "None of the above", "Cross-Site Scripting"], answer: 3 },
    { q: "Which port does HTTP use by default?", opts: ["443", "80", "25", "21"], answer: 1 },
    { q: "What is the main purpose of a firewall?", opts: ["Block unauthorized access", "Backup data", "Speed up internet", "Encrypt data"], answer: 0 },
    { q: "Which protocol is secure for sending emails?", opts: ["SMTPS", "SMTP", "POP3", "IMAP"], answer: 0 },
    { q: "What kind of attack is SQL Injection?", opts: ["Phishing", "Code Injection", "Denial of Service", "Man-in-the-Middle"], answer: 1 },
    { q: "What tool is commonly used for network scanning?", opts: ["Metasploit", "Burp Suite", "Nmap", "Wireshark"], answer: 2 },
    { q: "Which of these is a hashing algorithm?", opts: ["RSA", "AES", "DES", "MD5"], answer: 3 },
    { q: "In penetration testing, what does 'pivoting' mean?", opts: ["Using one compromised system to attack others", "Creating phishing emails", "Stealing passwords", "Encrypting files"], answer: 0 },
    { q: "Which language is primarily used to write exploits?", opts: ["HTML", "SQL", "Python", "CSS"], answer: 2 },
    { q: "What does VPN stand for?", opts: ["Virtual Private Network", "Visual Protocol Network", "Verified Public Network", "Variable Packet Node"], answer: 0 },
    { q: "Which is a common web vulnerability scanner?", opts: ["Nikto", "Metasploit", "Nmap", "John the Ripper"], answer: 0 },
    { q: "What is phishing?", opts: ["A social engineering attack to steal info", "Physical theft", "Password cracking", "Malware infection"], answer: 0 },
    { q: "Difference between symmetric and asymmetric encryption?", opts: ["Symmetric is slower", "Symmetric uses same key; asymmetric uses public/private keys", "Symmetric is for emails", "No difference"], answer: 1 },
    { q: "Which is NOT a Linux command?", opts: ["cd", "ls", "grep", "dir"], answer: 3 },
    { q: "What is Burp Suite used for?", opts: ["Web app security testing", "Password cracking", "Network scanning", "Malware analysis"], answer: 0 },
    { q: "Which attack overwhelms a system with traffic?", opts: ["Phishing", "Brute Force", "DDoS", "Spoofing"], answer: 2 },
    { q: "Which OSI layer handles routing?", opts: ["Transport", "Data Link", "Network", "Physical"], answer: 2 },
    { q: "What is social engineering?", opts: ["Network scanning", "Hardware hacking", "Software exploits", "Manipulating people to give info"], answer: 3 },
    { q: "What is a zero-day vulnerability?", opts: ["An old virus", "A patched bug", "A type of firewall", "An unknown software flaw exploited before patching"], answer: 3 },
    { q: "Which is NOT a cyber attack type?", opts: ["Ransomware", "Trojan", "Spyware", "Wormhole"], answer: 3 }
  ];

  const total = questions.length;
  document.getElementById('totalQuestions').textContent = total;
  let selectedAnswers = new Array(total).fill(-1);
  let submitted = false;

  function renderQuestions() {
    const area = document.getElementById('questionsArea');
    let html = '';
    questions.forEach((q, i) => {
      html += `<div class="question-card">
        <div class="q-num">Question ${i + 1} of ${total}</div>
        <div class="q-text">${q.q}</div>
        <div class="options">`;
      q.opts.forEach((opt, j) => {
        html += `<label><input type="radio" name="q${i}" value="${j}" onchange="selectAnswer(${i}, ${j})"> ${opt}</label>`;
      });
      html += `</div></div>`;
    });
    area.innerHTML = html;
  }

  function selectAnswer(qIdx, optIdx) {
    if (submitted) return;
    selectedAnswers[qIdx] = optIdx;
  }

  function submitQuiz() {
    if (submitted) return;
    const status = document.getElementById('statusMsg');
    const btn = document.getElementById('submitBtn');

    // Check all answered
    const unanswered = selectedAnswers.findIndex(a => a === -1);
    if (unanswered >= 0) {
      status.textContent = `⚠️ You haven't answered Question ${unanswered + 1}!`;
      status.style.color = '#ffaa00';
      document.querySelectorAll('.question-card')[unanswered].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    let correct = 0;
    questions.forEach((q, i) => {
      if (selectedAnswers[i] === q.answer) correct++;
      // Highlight correct/wrong
      const labels = document.querySelectorAll(`input[name="q${i}"]`);
      labels.forEach((input, j) => {
        const label = input.closest('label');
        input.disabled = true;
        if (j === q.answer) {
          label.style.borderColor = '#00ff41';
          label.style.background = 'rgba(0,255,65,0.1)';
        } else if (j === selectedAnswers[i] && j !== q.answer) {
          label.style.borderColor = '#ff3333';
          label.style.background = 'rgba(255,51,51,0.1)';
        }
      });
    });

    submitted = true;
    document.getElementById('correctCount').textContent = correct;
    btn.disabled = true;
    btn.textContent = '✅ Submitted';

    // Save score to localStorage (for leaderboard)
    localStorage.setItem('level6_score', correct);

    const passed = correct >= 14;
    status.innerHTML = passed 
      ? `🎉 <strong>ELITE!</strong> You scored ${correct}/${total} — Points saved to leaderboard!`
      : `📚 You scored ${correct}/${total}. Need ${14 - correct} more to pass. Keep practicing!`;
    status.style.color = passed ? '#00ff41' : '#ffaa00';
  }

  renderQuestions();
</script>
</body>
</html>

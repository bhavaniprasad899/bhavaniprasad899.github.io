<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CyberArena Leaderboard - Track your hacking challenge scores">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data:;">
  <title>Leaderboard | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e17;
      --bg2: #111827;
      --primary: #00ff41;
      --text: #c8d6e5;
      --text-dim: #4a5568;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }
    nav {
      background: rgba(10,14,23,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,255,65,0.15);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    nav .logo a {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0,255,65,0.5);
      letter-spacing: 3px;
    }
    nav .logo a span { color: #0ff; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; }
    .nav-links a:hover { color: var(--primary); }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .hero { text-align: center; padding: 3rem 1rem 2rem; }
    .hero h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(0,255,65,0.3);
    }
    .hero h1 span { color: var(--primary); }
    .hero p { color: var(--text-dim); margin-top: 0.5rem; }
    .score-card {
      background: rgba(17,24,39,0.8);
      border: 1px solid rgba(0,255,65,0.15);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      margin: 2rem auto;
      max-width: 400px;
    }
    .score-card .score-num {
      font-family: var(--font-display);
      font-size: 4rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 40px rgba(0,255,65,0.4);
    }
    .score-card p { color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
    .save-area {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .save-area input {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--text-dim);
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: var(--font-mono);
      border-radius: 8px;
      width: 200px;
      outline: none;
    }
    .save-area input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,65,0.2); }
    .btn {
      padding: 0.7rem 1.5rem;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .btn:hover { background: var(--primary); color: var(--bg); box-shadow: 0 0 25px rgba(0,255,65,0.3); }
    .btn-danger { border-color: #ff3333; color: #ff3333; }
    .btn-danger:hover { background: #ff3333; color: #fff; }
    .table-container {
      background: rgba(17,24,39,0.6);
      border: 1px solid rgba(0,255,65,0.1);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 2rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: rgba(0,255,65,0.08);
      padding: 1rem;
      text-align: left;
      font-family: var(--font-display);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      border-bottom: 1px solid rgba(0,255,65,0.15);
    }
    td { padding: 1rem; border-bottom: 1px solid rgba(0,255,65,0.05); }
    tr:hover td { background: rgba(0,255,65,0.03); }
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .level-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      border: 1px solid;
    }
    .level-beginner { border-color: var(--primary); color: var(--primary); }
    .level-intermediate { border-color: #ffaa00; color: #ffaa00; }
    .level-advanced { border-color: #ff3333; color: #ff3333; }
    .empty-msg { text-align: center; padding: 3rem; color: var(--text-dim); }
    .footer { text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid rgba(0,255,65,0.1); margin-top: 3rem; }
    @media (max-width: 600px) {
      nav { padding: 0 1rem; }
      .nav-links { gap: 0.8rem; }
      .nav-links a { font-size: 0.7rem; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><a href="/">Cyber<span>Arena</span></a></div>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="awareness.html">Awareness</a></li>
    <li><a href="task.html">Challenges</a></li>
    <li><a href="terminal.html">Terminal</a></li>
    <li><a href="whois.html">WHOIS</a></li>
  </ul>
</nav>

<div class="container">
  <div class="hero">
    <h1>🏆 <span>Leaderboard</span></h1>
    <p>Complete challenges to earn points. Save your name to appear on the leaderboard!</p>
  </div>

  <!-- Score Card -->
  <div class="score-card">
    <div class="score-num" id="totalPoints">0</div>
    <p>Total Points Earned</p>
    <div class="save-area">
      <input type="text" id="playerName" placeholder="Enter your hacker name..." maxlength="20">
      <button class="btn" onclick="saveScore()">💾 Save My Score</button>
      <button class="btn btn-danger" onclick="clearScores()">🗑 Reset</button>
    </div>
    <div id="saveMsg" style="margin-top:0.8rem;font-size:0.8rem;min-height:1.2rem;"></div>
  </div>

  <!-- Leaderboard Table -->
  <h2 style="font-family:var(--font-display);color:#fff;margin-bottom:1rem;">🏅 Top Hackers</h2>
  <div class="table-container">
    <div id="leaderboardBody"></div>
  </div>
</div>

<div class="footer">
  CyberArena — Educational Cybersecurity Platform | <a href="/" style="color:var(--primary);">Home</a>
</div>

<script>
  // ===== GET SCORES FROM localStorage =====
  function getScores() {
    try {
      const data = JSON.parse(localStorage.getItem('cyberarena_scores') || '[]');
      return Array.isArray(data) ? data : [];
    } catch(e) { return []; }
  }

  function saveScores(scores) {
    localStorage.setItem('cyberarena_scores', JSON.stringify(scores));
  }

  // ===== GET TOTAL POINTS FROM ALL LEVELS =====
  function getTotalPoints() {
    let total = 0;
    for (let i = 1; i <= 6; i++) {
      const key = 'level' + i + '_score';
      const val = parseInt(localStorage.getItem(key) || '0');
      total += val;
    }
    return total;
  }

  // ===== CALCULATE LEVEL BASED ON POINTS =====
  function getLevel(points) {
    if (points >= 25) return { name: 'Elite Hacker', cls: 'level-advanced' };
    if (points >= 15) return { name: 'Advanced', cls: 'level-advanced' };
    if (points >= 8) return { name: 'Intermediate', cls: 'level-intermediate' };
    return { name: 'Beginner', cls: 'level-beginner' };
  }

  // ===== SAVE SCORE =====
  function saveScore() {
    const nameInput = document.getElementById('playerName');
    const name = nameInput.value.trim();
    const msg = document.getElementById('saveMsg');

    if (!name) {
      msg.textContent = '⚠️ Enter a hacker name first!';
      msg.style.color = '#ffaa00';
      return;
    }

    const total = getTotalPoints();
    if (total === 0) {
      msg.textContent = '⚠️ Complete challenges first to earn points!';
      msg.style.color = '#ffaa00';
      return;
    }

    let scores = getScores();
    
    // Check if this name already exists — update if so
    const existing = scores.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
    if (existing >= 0) {
      scores[existing].points = total;
      scores[existing].date = new Date().toISOString();
    } else {
      scores.push({
        name: name,
        points: total,
        date: new Date().toISOString()
      });
    }

    saveScores(scores);
    msg.textContent = '✅ Score saved! You\'re on the leaderboard!';
    msg.style.color = '#00ff41';
    renderLeaderboard();
    updateTotalDisplay();
    nameInput.value = '';
    setTimeout(() => msg.textContent = '', 3000);
  }

  // ===== CLEAR ALL SCORES =====
  function clearScores() {
    if (!confirm('⚠️ Reset all scores and leaderboard data?')) return;
    localStorage.removeItem('cyberarena_scores');
    for (let i = 1; i <= 6; i++) {
      localStorage.removeItem('level' + i + '_score');
    }
    renderLeaderboard();
    updateTotalDisplay();
    document.getElementById('saveMsg').textContent = '🗑 All data reset';
    document.getElementById('saveMsg').style.color = '#ff3333';
    setTimeout(() => document.getElementById('saveMsg').textContent = '', 2000);
  }

  // ===== UPDATE TOTAL POINTS DISPLAY =====
  function updateTotalDisplay() {
    document.getElementById('totalPoints').textContent = getTotalPoints();
  }

  // ===== RENDER LEADERBOARD =====
  function renderLeaderboard() {
    const container = document.getElementById('leaderboardBody');
    let scores = getScores();

    if (scores.length === 0) {
      container.innerHTML = `<table><thead><tr><th>Rank</th><th>Name</th><th>Points</th><th>Level</th></tr></thead><tbody><tr><td colspan="4" class="empty-msg">No hackers yet — complete challenges and save your score!</td></tr></tbody></table>`;
      return;
    }

    // Sort by points descending
    scores.sort((a, b) => b.points - a.points);

    let html = `<table><thead><tr><th>Rank</th><th>Name</th><th>Points</th><th>Level</th></tr></thead><tbody>`;
    
    scores.forEach((s, i) => {
      const rank = i + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      const level = getLevel(s.points);
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
      html += `<tr>
        <td class="${rankClass}">${medal} ${rank}</td>
        <td style="color:#fff;">${s.name}</td>
        <td style="color:var(--primary);font-family:var(--font-display);font-weight:700;">${s.points}</td>
        <td><span class="level-badge ${level.cls}">${level.name}</span></td>
      </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  // ===== INIT =====
  updateTotalDisplay();
  renderLeaderboard();

  // Auto-save the score on load if player already saved before
  const existing = getScores();
  if (existing.length > 0) {
    // Update the display with latest total
    const latest = existing[0];
    // But don't auto-overwrite
  }
</script>
</body>
</html>

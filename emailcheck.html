<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberArena – Email Breach Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #00ff00;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="email"] {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 4px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            outline: none;
        }
        input[type="email"]:focus {
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }
        input[type="email"]::placeholder {
            color: #0a5a0a;
        }
        button {
            padding: 12px 24px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }
        button:disabled {
            background: #0a5a0a;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status {
            text-align: center;
            padding: 10px;
            color: #0a0;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status.loading {
            color: #ffff00;
            animation: blink 1s infinite;
        }
        .status.error {
            color: #ff4444;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .result {
            background: #0d0d0d;
            border: 1px solid #0a5a0a;
            border-radius: 4px;
            padding: 16px;
            font-size: 13px;
            line-height: 1.8;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .result.show {
            display: block;
        }
        .result .label {
            color: #00ff00;
            font-weight: bold;
        }
        .result .value {
            color: #ccffcc;
        }
        .result .breach-item {
            background: #141414;
            border: 1px solid #1a3a1a;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .result .breach-item:last-child {
            margin-bottom: 0;
        }
        .result .breach-name {
            color: #ff4444;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result .breach-date {
            color: #aaaa00;
            font-size: 12px;
        }
        .result .breach-desc {
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
        }
        .result .safe-message {
            color: #00ff00;
            text-align: center;
            font-size: 18px;
            padding: 30px;
        }
        .privacy-note {
            text-align: center;
            color: #0a5a0a;
            font-size: 11px;
            margin-top: 15px;
        }
        .example-hint {
            text-align: center;
            color: #0a5a0a;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .example-hint span {
            color: #00aa00;
            cursor: pointer;
            text-decoration: underline;
        }
        .example-hint span:hover {
            color: #00ff00;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0a5a0a;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Breach Check</h1>
        
        <div class="input-group">
            <input type="email" id="emailInput" placeholder="Enter your email address" autocomplete="off">
            <button id="checkBtn">CHECK</button>
        </div>

        <div class="example-hint">
            Try: <span onclick="fillExample('test@example.com')">test@example.com</span> · 
            <span onclick="fillExample('steve@gmail.com')">steve@gmail.com</span>
        </div>

        <div id="status" class="status">Enter an email and click CHECK</div>

        <div id="result" class="result"></div>

        <div class="privacy-note">
            🔒 Your email is hashed locally — only the first 5 characters of the hash are sent. Your email never leaves your browser.
        </div>

        <a href="index.html" class="back-link">⬅ Back to Home</a>
    </div>

    <script>
        const emailInput = document.getElementById('emailInput');
        const checkBtn = document.getElementById('checkBtn');
        const status = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        function fillExample(email) {
            emailInput.value = email;
            checkBreach();
        }

        async function sha1(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-1', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        async function checkBreach() {
            const email = emailInput.value.trim().toLowerCase();
            
            if (!email || !email.includes('@')) {
                status.textContent = '⚠️ Please enter a valid email address';
                status.className = 'status error';
                return;
            }

            checkBtn.disabled = true;
            status.textContent = '⏳ Hashing and checking...';
            status.className = 'status loading';
            resultDiv.classList.remove('show');

            try {
                // Hash the email using SHA-1
                const hash = await sha1(email);
                const prefix = hash.substring(0, 5);
                const suffix = hash.substring(5);

                // Query HIBP API with just the prefix (k-anonymity model)
                const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const text = await response.text();
                const lines = text.split('\n');
                
                // Look for our suffix in the results
                let found = false;
                let count = 0;
                
                for (const line of lines) {
                    const [hashSuffix, occurrenceCount] = line.split(':');
                    if (hashSuffix === suffix) {
                        found = true;
                        count = parseInt(occurrenceCount);
                        break;
                    }
                }

                if (found) {
                    let html = '';
                    html += `<div style="text-align:center;margin-bottom:15px;">`;
                    html += `<span style="font-size:40px;">⚠️</span>`;
                    html += `<div style="color:#ff4444;font-size:20px;margin-top:10px;">BREACH FOUND</div>`;
                    html += `<div style="color:#ffaa00;font-size:16px;">This email appears in <strong>${count.toLocaleString()}</strong> known data breaches</div>`;
                    html += `</div>`;
                    html += `<div style="text-align:center;font-size:12px;color:#aa5555;">`;
                    html += `⚠️ It is strongly recommended to change passwords associated with this email`;
                    html += `</div>`;
                    resultDiv.innerHTML = html;
                    
                    status.textContent = `❌ Email found in ${count.toLocaleString()} breach(es)`;
                    status.className = 'status error';
                } else {
                    resultDiv.innerHTML = `<div class="safe-message">✅ Good news! No breaches found for this email</div>`;
                    status.textContent = '✅ No breaches detected — email appears safe';
                    status.className = 'status';
                }

                resultDiv.classList.add('show');

            } catch (error) {
                status.textContent = `❌ Error: ${error.message}`;
                status.className = 'status error';
                resultDiv.classList.remove('show');
            } finally {
                checkBtn.disabled = false;
            }
        }

        checkBtn.addEventListener('click', checkBreach);
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkBreach();
            }
        });
        emailInput.focus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data:;">
  <title>Level 3 – Command Line Hacking | CyberArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0e17; --bg2:#111827; --primary:#00ff41; --text:#c8d6e5; --text-dim:#4a5568; --font-mono:'Share Tech Mono',monospace; --font-display:'Orbitron',sans-serif; }
    body { background:var(--bg); color:var(--text); font-family:var(--font-mono); min-height:100vh; padding:2rem; }
    .container { max-width:700px; margin:0 auto; }
    h1 { font-family:var(--font-display); font-size:2rem; color:#fff; text-align:center; }
    h1 span { color:var(--primary); }
    .subtitle { text-align:center; color:var(--text-dim); margin-bottom:2rem; font-size:0.9rem; }
    .score-bar { display:flex; justify-content:space-between; background:var(--bg2); border:1px solid rgba(0,255,65,0.1); border-radius:12px; padding:1rem 1.5rem; margin-bottom:2rem; }
    .score-bar .score { font-family:var(--font-display); color:var(--primary); font-size:1.3rem; }
    .challenge-card { background:var(--bg2); border:1px solid rgba(0,255,65,0.12); border-radius:16px; padding:1.5rem; margin-bottom:1rem; }
    .challenge-card .num { color:var(--primary); font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; }
    .challenge-card .question { color:#fff; margin:0.5rem 0 1rem; }
    input, textarea { width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--text-dim); border-radius:8px; padding:0.7rem 1rem; color:var(--text); font-family:var(--font-mono); outline:none; margin-bottom:0.5rem; }
    input:focus { border-color:var(--primary); }
    .chk-btn { padding:0.6rem 1.5rem; border:1px solid var(--primary); background:transparent; color:var(--primary); font-family:var(--font-mono); cursor:pointer; border-radius:6px; transition:all 0.3s; }
    .chk-btn:hover { background:var(--primary); color:var(--bg); }
    .fb { font-size:0.85rem; min-height:1.5rem; margin-top:0.5rem; }
    .fb-correct { color:var(--primary); }
    .fb-wrong { color:#ff3333; }
    .back { text-align:center; margin-top:2rem; }
    .back a { color:var(--primary); text-decoration:none; }
    @media(max-width:600px) { body { padding:1rem; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🟡 <span>Level 3</span> — Command Line Hacking</h1>
  <p class="subtitle">Test your Linux terminal knowledge. Answer all 6 to pass.</p>
  <div class="score-bar"><span>Score</span><span class="score"><span id="scoreDisplay">0</span>/<span id="totalDisplay">6</span></span></div>
  <div id="challenges"></div>
  <div class="back"><a href="task.html">⬅ Back to Levels</a></div>
</div>
<script>
  const challenges = [
    { q: "What command lists all files in a directory (including hidden)?", answer: "ls -la" },
    { q: "What command shows your current directory path?", answer: "pwd" },
    { q: "What command changes directory?", answer: "cd" },
    { q: "What command shows running processes?", answer: "ps aux" },
    { q: "What command shows network connections?", answer: "netstat -tulpn" },
    { q: "What command checks if a host is reachable?", answer: "ping" }
  ];

  let score = parseInt(localStorage.getItem('level3_score') || '0');
  let done = JSON.parse(localStorage.getItem('level3_done') || '[false,false,false,false,false,false]');

  document.getElementById('totalDisplay').textContent = challenges.length;
  document.getElementById('scoreDisplay').textContent = score;

  function render() {
    const area = document.getElementById('challenges');
    let html = '';
    challenges.forEach((c, i) => {
      const completed = done[i] || false;
      html += `<div class="challenge-card" id="card${i}">
        <div class="num">Challenge ${i+1} of ${challenges.length} ${completed ? '✅' : ''}</div>
        <div class="question">${c.q}</div>
        <input type="text" id="ans${i}" placeholder="Type your command..." ${completed ? 'disabled' : ''}>
        <button class="chk-btn" onclick="check(${i})" ${completed ? 'disabled' : ''}>${completed ? 'Done ✓' : 'Check'}</button>
        <div class="fb" id="fb${i}"></div>
      </div>`;
    });
    area.innerHTML = html;
    if (done.every(d => d) && score === challenges.length) {
      // All done — show completion
    }
  }

  function check(idx) {
    const input = document.getElementById('ans' + idx);
    const fb = document.getElementById('fb' + idx);
    const ans = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
    if (!ans) { fb.textContent = '⚠️ Type a command!'; fb.className = 'fb'; return; }
    const correct = challenges[idx].answer.toLowerCase();
    if (ans === correct || ans === correct.replace(/\s+/g, ' ')) {
      fb.textContent = '✅ Correct!'; fb.className = 'fb fb-correct';
      if (!done[idx]) {
        done[idx] = true;
        score++;
        localStorage.setItem('level3_score', score);
        localStorage.setItem('level3_done', JSON.stringify(done));
        document.getElementById('scoreDisplay').textContent = score;
      }
      input.disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).disabled = true;
      document.querySelector(`#card${idx} .chk-btn`).textContent = 'Done ✓';
    } else {
      fb.textContent = '❌ Try again. Hint: check the Terminal simulator for help!'; fb.className = 'fb fb-wrong';
    }
  }

  render();
</script>
</body>
</html>
